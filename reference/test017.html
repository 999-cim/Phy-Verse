  <!-- ==== Part B START: PhyGenius CSS (原 Part 1) ==== -->
 <style id="phy-css">
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --primary-light: #eef2ff;
      --primary-lighter: #e0e7ff;
      --text: #1e293b;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --card: #ffffff;
      --card-hover: #fafbff;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --success: #10b981;
      --success-light: #d1fae5;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
      --shadow-lg: 0 12px 32px rgba(15,23,42,0.12);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-light: #1e1b4b;
      --primary-lighter: #312e81;
      --text: #e2e8f0;
      --text-secondary: #cbd5e1;
      --muted: #64748b;
      --bg: #0f172a;
      --bg-elevated: #1e293b;
      --card: #1e293b;
      --card-hover: #243447;
      --border: #334155;
      --border-light: #1e293b;
      --success: #34d399;
      --success-light: #064e3b;
      --warning: #fbbf24;
      --warning-light: #78350f;
      --danger: #f87171;
      --danger-light: #7f1d1d;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      font-size: 14px;
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: #fff;
      box-shadow: var(--shadow-md);
    }
    [data-theme="dark"] .header { background: linear-gradient(135deg, #312e81 0%, #5b21b6 100%); }
    .header-inner {
      max-width: 780px; margin: 0 auto;
      padding: 0 16px; height: 60px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo-badge {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-badge svg { width: 22px; height: 22px; }
    .logo-name { font-weight: 700; font-size: 17px; color: #fff; letter-spacing: -0.01em; }
    .logo-ver {
      font-size: 9px; font-weight: 700;
      background: rgba(255,255,255,0.25);
      color: #fff; padding: 2px 6px; border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; transition: all var(--transition);
      font-family: inherit;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.28); transform: scale(1.05); }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn svg { width: 18px; height: 18px; }
    .lang-btn {
      height: 36px; padding: 0 12px; border-radius: 10px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: none; cursor: pointer; color: #fff;
      font-weight: 600; font-size: 12px; font-family: inherit;
      letter-spacing: 0.05em; transition: all var(--transition);
    }
    .lang-btn:hover { background: rgba(255,255,255,0.28); }
    .streak-badge {
      display: flex; align-items: center; gap: 4px;
      background: rgba(251,191,36,0.25);
      color: #fef3c7; padding: 6px 10px; border-radius: 10px;
      font-size: 12px; font-weight: 700;
      border: 1px solid rgba(251,191,36,0.3);
      transition: transform var(--transition);
    }
    .streak-badge.pulse { animation: pulse 0.5s ease-out; }
    @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.15);} 100%{transform:scale(1);} }
    .streak-badge svg { width: 14px; height: 14px; }
    .streak-badge.hidden { display: none; }
    .main { max-width: 780px; margin: 0 auto; padding: 16px; }
    .panel { display: none; }
    .panel.active { display: block; animation: panelIn 0.3s cubic-bezier(0.4,0,0.2,1); }
    @keyframes panelIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    .page-title {
      font-size: 22px; font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px; color: var(--text);
    }
    .page-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .card {
      background: var(--card); border-radius: var(--radius-lg);
      padding: 18px; margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: all var(--transition);
    }
    [data-theme="dark"] .card { border-color: var(--border); }
    .section-label {
      font-size: 12px; font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px; display: block;
    }
    .chip-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 18px;
    }
    .chip {
      padding: 10px 8px;
      border: 2px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      font-size: 13px; cursor: pointer;
      font-family: inherit; color: var(--text);
      text-align: center;
      transition: all var(--transition);
      font-weight: 500;
    }
    .chip:hover { border-color: var(--primary); transform: translateY(-1px); }
    .chip.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 0 0 3px var(--primary-lighter);
    }
    [data-theme="dark"] .chip.selected { color: #c7d2fe; }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: #fff; border: none;
      padding: 15px; border-radius: var(--radius);
      font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: all var(--transition);
      box-shadow: 0 4px 14px rgba(79,70,229,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: -0.01em;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.45); }
    .btn-primary:active { transform: translateY(0) scale(0.99); }
    .btn-primary svg { width: 18px; height: 18px; }
    .range-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    input[type="range"] {
      flex: 1; height: 6px; border-radius: 3px;
      background: var(--border); outline: none;
      -webkit-appearance: none; appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(79,70,229,0.4);
      border: 3px solid var(--card);
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--primary); cursor: pointer;
      border: 3px solid var(--card);
    }
    .range-val { font-weight: 800; color: var(--primary); min-width: 32px; text-align: center; font-size: 18px; }
    .question {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 18px; margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      animation: qIn 0.35s cubic-bezier(0.4,0,0.2,1);
      position: relative; overflow: hidden;
    }
    [data-theme="dark"] .question { border-color: var(--border); }
    .question::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 4px; height: 100%;
      background: linear-gradient(180deg, var(--primary) 0%, #7c3aed 100%);
    }
    @keyframes qIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
    .q-head {
      display: flex; justify-content: space-between;
      align-items: flex-start; margin-bottom: 12px;
      gap: 8px; flex-wrap: wrap;
    }
    .q-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge-num {
      background: var(--primary); color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
      letter-spacing: 0.02em;
    }
    .badge-topic {
      background: var(--border-light); color: var(--text-secondary);
      font-size: 11px; padding: 3px 10px;
      border-radius: 20px; font-weight: 600;
    }
    [data-theme="dark"] .badge-topic { background: var(--border); }
    .badge-marks {
      color: var(--primary); font-size: 12px;
      font-weight: 800; padding: 3px 10px;
      background: var(--primary-light); border-radius: 20px;
    }
    .q-text { font-size: 15px; line-height: 1.7; margin-bottom: 14px; color: var(--text); font-weight: 500; }
    .q-timer {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--muted);
      background: var(--border-light);
      padding: 3px 8px; border-radius: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    [data-theme="dark"] .q-timer { background: var(--border); }
    .q-timer svg { width: 12px; height: 12px; }
    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px; font-size: 14px;
      font-family: inherit; resize: vertical;
      outline: none; background: var(--bg);
      min-height: 62px; color: var(--text);
      transition: all var(--transition);
      line-height: 1.5;
    }
    textarea:focus {
      border-color: var(--primary);
      background: var(--card);
      box-shadow: 0 0 0 4px var(--primary-lighter);
    }
    textarea::placeholder { color: var(--muted); }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn-grade {
      flex: 1; min-width: 120px;
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: #fff; border: none;
      padding: 11px; border-radius: var(--radius);
      font-weight: 700; font-size: 14px;
      cursor: pointer; font-family: inherit;
      transition: all var(--transition);
      box-shadow: 0 3px 10px rgba(79,70,229,0.25);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-grade:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(79,70,229,0.35); }
    .btn-grade:active { transform: scale(0.98); }
    .btn-grade svg { width: 16px; height: 16px; }
    .btn-sol, .btn-hint {
      background: var(--border-light); color: var(--text-secondary);
      border: none; padding: 11px 16px; border-radius: var(--radius);
      font-weight: 600; font-size: 14px;
      cursor: pointer; font-family: inherit;
      transition: all var(--transition);
      display: flex; align-items: center; gap: 6px;
    }
    [data-theme="dark"] .btn-sol, [data-theme="dark"] .btn-hint { background: var(--border); color: var(--text); }
    .btn-sol:hover, .btn-hint:hover { background: var(--border); }
    [data-theme="dark"] .btn-sol:hover, [data-theme="dark"] .btn-hint:hover { background: #475569; }
    .btn-sol svg, .btn-hint svg { width: 16px; height: 16px; }
    .result { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 14px; }
    .result.show { display: block; animation: panelIn 0.25s ease-out; }
    .result .verdict { font-weight: 800; font-size: 15px; }
    .result.correct .verdict { color: var(--success); }
    .result.wrong .verdict { color: var(--danger); }
    .result .expected {
      font-size: 12px; color: var(--muted);
      margin-top: 6px; font-family: 'SF Mono', Menlo, monospace;
    }
    .score-ring-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .score-ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
    .score-ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
    .score-ring .ring-bg { fill: none; stroke: var(--border); stroke-width: 5; }
    .score-ring .ring-fg { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray 0.6s cubic-bezier(0.4,0,0.2,1); }
    .score-ring .ring-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .score-meta { flex: 1; }
    .score-meta .score-pts { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .score-meta .score-msg { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .hint-box {
      display: none; margin-top: 10px;
      background: var(--warning-light);
      border-left: 4px solid var(--warning);
      border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 13px;
      color: var(--text);
    }
    .hint-box.show { display: block; animation: panelIn 0.25s ease-out; }
    .hint-label {
      font-size: 11px; font-weight: 800;
      color: var(--warning); text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 4px;
    }
    .solution {
      display: none; margin-top: 12px;
      background: var(--success-light);
      border: 1px solid var(--success);
      border-radius: var(--radius);
      padding: 14px; font-size: 13px;
      color: var(--text); white-space: pre-wrap;
      line-height: 1.7; font-family: 'SF Mono', Menlo, monospace;
    }
    .solution.show { display: block; animation: panelIn 0.25s ease-out; }
    .solution .sol-label {
      font-size: 11px; font-weight: 800;
      color: var(--success); text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 8px;
      font-family: -apple-system, sans-serif;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
    .stat {
      background: var(--card); border-radius: var(--radius-lg);
      padding: 18px; text-align: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: all var(--transition);
    }
    [data-theme="dark"] .stat { border-color: var(--border); }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px;
    }
    [data-theme="dark"] .stat-icon { color: #c7d2fe; }
    .stat-icon svg { width: 20px; height: 20px; }
    .stat-num {
      font-size: 26px; font-weight: 800;
      color: var(--text); letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 11px; color: var(--muted);
      margin-top: 4px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .history-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    [data-theme="dark"] .history-row { border-color: var(--border); }
    .history-row:last-child { border-bottom: none; }
    .history-row .h-topic { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500; }
    .history-row .h-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .history-row .h-score {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 3px 10px; border-radius: 10px;
      font-size: 12px;
    }
    .empty-msg {
      font-size: 13px; color: var(--muted);
      text-align: center; padding: 32px 16px;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .empty-msg svg { width: 40px; height: 40px; opacity: 0.4; }
    .lib-card {
      background: var(--card); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: all var(--transition);
    }
    [data-theme="dark"] .lib-card { border-color: var(--border); }
    .lib-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .lib-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .lib-topic { font-weight: 700; font-size: 15px; color: var(--text); }
    .lib-count {
      font-size: 11px; color: var(--primary);
      background: var(--primary-light); padding: 3px 10px;
      border-radius: 12px; font-weight: 700;
    }
    [data-theme="dark"] .lib-count { color: #c7d2fe; }
    .lib-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .lib-chip {
      font-size: 11px; background: var(--border-light);
      color: var(--text-secondary); padding: 4px 10px;
      border-radius: 12px; font-weight: 500;
    }
    [data-theme="dark"] .lib-chip { background: var(--border); }
    .formula-group {
      background: var(--card); border-radius: var(--radius-lg);
      padding: 16px; margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }
    [data-theme="dark"] .formula-group { border-color: var(--border); }
    .formula-group h3 {
      font-size: 14px; font-weight: 700;
      color: var(--primary); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .formula-item {
      display: flex; align-items: baseline; gap: 12px;
      padding: 8px 0; border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    [data-theme="dark"] .formula-item { border-color: var(--border); }
    .formula-item:last-child { border-bottom: none; }
    .formula-eq {
      font-family: 'SF Mono', Menlo, monospace;
      font-weight: 700; color: var(--text);
      background: var(--primary-light);
      padding: 3px 8px; border-radius: 6px;
      font-size: 12px;
      white-space: nowrap; flex-shrink: 0;
    }
    [data-theme="dark"] .formula-eq { color: #c7d2fe; }
    .formula-desc { color: var(--text-secondary); font-size: 12px; line-height: 1.4; }
    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.04);
    }
    .tabbar-inner { display: flex; max-width: 780px; margin: 0 auto; }
    .tab-btn {
      flex: 1; background: none; border: none;
      padding: 10px 4px 8px;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; font-size: 10px; font-weight: 600;
      color: var(--muted);
      font-family: inherit;
      transition: color var(--transition);
      position: relative;
    }
    .tab-btn.active { color: var(--primary); }
    .tab-btn.active::before {
      content: '';
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 32px; height: 3px;
      background: var(--primary);
      border-radius: 0 0 3px 3px;

      }

      function PHY_esc(s) {
        var str = String(s);
        var out = "";
        for (var i = 0; i < str.length; i++) {
          var c = str.charAt(i);
          if (c === "&") { out += "&amp;"; }
          else if (c === "<") { out += "&lt;"; }
          else if (c === ">") { out += "&gt;"; }
          else if (c === '"') { out += "&quot;"; }
          else { out += c; }
        }
        return out;
      }

      function PHY_loadState() {

        try {

          if (lang === "en" || lang === "zh") { PHY_LANG = lang; }
        } catch (e2) {}
        try {
          var theme = localStorage.getItem("phy_theme_v2");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e3) {}
        try {
          var notes = localStorage.getItem("phy_notes_v2");
          if (notes) { PHY_STATE.notes = JSON.parse(notes); }

            PHY_STATE.bestStreak = s.best || 0;

        } catch (e5) {}

      /* ============================================================

         ============================================================ */
      function PHY_applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        var lightIcon = PHY_$("themeIconLight");
        var darkIcon = PHY_$("themeIconDark");
        if (lightIcon && darkIcon) {
          if (theme === "dark") {
            lightIcon.classList.add("hidden");
            darkIcon.classList.remove("hidden");
          } else {
            lightIcon.classList.remove("hidden");
            darkIcon.classList.add("hidden");
          }
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#312e81" : "#4f46e5");
        }
      }

      function PHY_toggleTheme() {
        var current = document.documentElement.getAttribute("data-theme") || "light";
        var next = (current === "dark") ? "light" : "dark";
        PHY_applyTheme(next);
        PHY_saveTheme(next);
        if (window.PhyVerse) {
          window.PhyVerse.setTheme(next);
        }
      }

      var PHY_confettiParticles = [];
      var PHY_confettiRAF = null;

      function PHY_launchConfetti() {
        var canvas = PHY_$("confettiCanvas");
        if (!canvas) { return; }
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var colors = ["#4f46e5", "#7c3aed", "#ec4899", "#f59e0b", "#10b981", "#3b82f6"];
        for (var i = 0; i < 60; i++) {
          PHY_confettiParticles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 200,
            y: canvas.height / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: Math.random() * -12 - 4,
            size: 6 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            vr: (Math.random() - 0.5) * 20,
            life: 1
          });
        }
        if (!PHY_confettiRAF) {
          PHY_confettiRAF = requestAnimationFrame(PHY_confettiStep);
        }
      }

      function PHY_confettiStep() {
        var canvas = PHY_$("confettiCanvas");
        if (!canvas) { return; }
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var alive = false;
        for (var i = 0; i < PHY_confettiParticles.length; i++) {
          var p = PHY_confettiParticles[i];
          if (p.life <= 0) { continue; }
          p.vy += 0.4;
          p.x += p.vx;
          p.y += p.vy;
          p.rotation += p.vr;
          p.life -= 0.012;
          if (p.y > canvas.height + 50) { p.life = 0; }
          if (p.life > 0) {
            alive = true;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
            ctx.restore();
          }
        }
        PHY_confettiParticles = PHY_confettiParticles.filter(function (p) { return p.life > 0; });
        if (alive) {
          PHY_confettiRAF = requestAnimationFrame(PHY_confettiStep);
        } else {
          PHY_confettiRAF = null;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      /* ============================================================

         ============================================================ */
      function PHY_generateQuestions() {
        var qCountEl = PHY_$("qCount");
        if (!qCountEl) { return; }
        var count = parseInt(qCountEl.value, 10);

        var topicPool = PHY_TEMPLATES.slice();
        if (PHY_STATE.topic !== "all") {
          topicPool = topicPool.filter(function (tpl) {
            return tpl.topic_zh === PHY_STATE.topic;
          });
        }
        if (topicPool.length === 0) {
          PHY_toast(PHY_t("toast_no_topic"), "warn");
          return;
        }

        var pool = topicPool;
        var fallbackUsed = false;

        if (PHY_STATE.diff !== "all") {
          var diffPool = topicPool.filter(function (tpl) {
            return tpl.difficulty === PHY_STATE.diff;
          });
          if (diffPool.length > 0) {
            pool = diffPool;
          } else {
            pool = topicPool;
            fallbackUsed = true;
          }
        }

        PHY_STATE.qs = [];
        PHY_STATE.notes = {};
        PHY_STATE.timers = {};
        PHY_STATE.sessionStart = Date.now();

        for (var i = 0; i < count; i++) {
          var tpl = pool[Math.floor(Math.random() * pool.length)];
          var result = tpl.gen(PHY_LANG);
          result.template_id = tpl.id;
          result.topic_zh = tpl.topic_zh;
          result.topic_en = tpl.topic_en;
          result.subtopic_zh = tpl.subtopic_zh;
          result.subtopic_en = tpl.subtopic_en;
          PHY_STATE.qs.push(result);
        }
        PHY_renderQuestions();

        if (fallbackUsed) {
          PHY_toast(PHY_t("toast_fallback_diff"), "info");
        } else {
          PHY_toast(PHY_t("toast_generated") + " (" + count + ")", "info");
        }
      }

      /* ============================================================
         TIMER & GRADING
         ============================================================ */
      function PHY_startTimer(idx) {
        function tick() {
          var t = PHY_STATE.timers[idx];
          if (!t || t.stopped) { return; }
          var elapsed = Math.floor((Date.now() - t.start) / 1000);
          t.elapsed = elapsed;
          var m = Math.floor(elapsed / 60);
          var s = elapsed % 60;
          var txt = m + ":" + (s < 10 ? "0" : "") + s;
          var el = PHY_$("timerTxt-" + idx);
          if (el) { el.textContent = txt; }
          setTimeout(tick, 1000);
        }
        tick();
      }

      function PHY_stopTimer(idx) {
        var t = PHY_STATE.timers[idx];
        if (t) { t.stopped = true; }
      }

      function PHY_extractNumbers(text) {
        var nums = [];
        var re = /-?\d+\.?\d*(?:[eE][+-]?\d+)?/g;
        var m;
        while ((m = re.exec(text)) !== null) {
          var n = parseFloat(m[0]);
          if (!isNaN(n)) { nums.push(n); }
        }
        return nums;
      }

      function PHY_gradeQuestion(idx) {
        var q = PHY_STATE.qs[idx];
        if (!q) { return; }
        var ta = PHY_$("ans-" + idx);
        if (!ta) { return; }
        var text = ta.value.trim();
        if (!text) {
          PHY_toast(PHY_t("alert_enter_answer"), "info");
          return;
        }

        var nums = PHY_extractNumbers(text);
        var tol = Math.abs(q.answer) * 0.02 + 1e-9;
        var hit = false;
        for (var n = 0; n < nums.length; n++) {
          if (Math.abs(nums[n] - q.answer) <= tol) { hit = true; break; }
        }

        PHY_stopTimer(idx);
        var elapsed = PHY_STATE.timers[idx] ? PHY_STATE.timers[idx].elapsed : 0;
        var score = hit ? q.marks : 0;
        var pct = Math.round((score / q.marks) * 100);

        var res = PHY_$("res-" + idx);
        if (!res) { return; }

        var verdictClass = hit ? "correct" : "wrong";
        var verdictText = hit ? PHY_t("verdict_correct") : PHY_t("verdict_wrong");
        var ringColor = hit ? "var(--success)" : "var(--danger)";
        var circumference = 2 * Math.PI * 24;
        var dashArr = (pct / 100) * circumference;

        res.className = "result show " + verdictClass;
        res.innerHTML = "";

        var ringWrap = document.createElement("div");
        ringWrap.className = "score-ring-wrap";

        var ring = document.createElement("div");
        ring.className = "score-ring";
        ring.innerHTML = '<svg viewBox="0 0 56 56">'
          + '<circle class="ring-bg" cx="28" cy="28" r="24"/>'
          + '<circle class="ring-fg" cx="28" cy="28" r="24" stroke="' + ringColor + '" stroke-dasharray="' + dashArr + ' ' + circumference + '"/>'
          + '</svg>'
          + '<div class="ring-text" style="color: ' + ringColor + ';">' + pct + '%</div>';
        ringWrap.appendChild(ring);

        var meta = document.createElement("div");
        meta.className = "score-meta";
        var pts = document.createElement("div");
        pts.className = "score-pts";
        pts.textContent = score + " / " + q.marks;
        var msg = document.createElement("div");
        msg.className = "score-msg";
        msg.textContent = verdictText + " · " + elapsed + PHY_t("time_sec");
        meta.appendChild(pts);
        meta.appendChild(msg);
        ringWrap.appendChild(meta);

        res.appendChild(ringWrap);

        var expected = document.createElement("div");
        expected.className = "expected";
        expected.textContent = PHY_t("expected_prefix") + PHY_f2(q.answer) + " " + q.unit;
        res.appendChild(expected);

        if (hit) {
          PHY_STATE.currentStreak += 1;
          if (PHY_STATE.currentStreak > PHY_STATE.bestStreak) {
            PHY_STATE.bestStreak = PHY_STATE.currentStreak;
          }
          PHY_toast(PHY_t("toast_correct") + " " + PHY_STATE.currentStreak + "!", "success");
          PHY_launchConfetti();
          var streakBadge = PHY_$("streakBadge");
          if (streakBadge) {
            streakBadge.classList.add("pulse");
            setTimeout(function () { streakBadge.classList.remove("pulse"); }, 500);
          }
        } else {
          PHY_STATE.currentStreak = 0;
          PHY_toast(PHY_t("toast_wrong"), "info");
        }
        PHY_saveStreak();
        PHY_updateStreakBadge();

        PHY_STATE.history.push({
          topic_zh: q.topic_zh,
          topic_en: q.topic_en,
          score: score,
          total: q.marks,
          elapsed: elapsed,
          ts: Date.now()
        });
        PHY_saveHistory();
      }

      function PHY_updateStreakBadge() {
        var badge = PHY_$("streakBadge");
        var count = PHY_$("streakCount");
        if (!badge || !count) { return; }
        if (PHY_STATE.currentStreak > 0) {
          badge.classList.remove("hidden");
          count.textContent = PHY_STATE.currentStreak;
        } else {
          badge.classList.add("hidden");
        }
      }

      function PHY_renderReport() {
        var h = PHY_STATE.history;
        var totalEl = PHY_$("statTotal");
        var avgEl = PHY_$("statAvg");

            totalTime += (h[i].elapsed || 0);
          }
          avgEl.textContent = Math.round(sum / h.length) + "%";
          var totalMin = Math.round(totalTime / 60);
          timeEl.innerHTML = totalMin + '<span style="font-size:14px;">m</span>';
        } else {
          avgEl.textContent = "--";
          timeEl.innerHTML = '0<span style="font-size:14px;">m</span>';
        }

        streakEl.textContent = PHY_STATE.bestStreak;

        var list = PHY_$("history");

            + '<span>' + PHY_esc(PHY_t("no_records")) + '</span>';

          return;
        }

        var recent = h.slice(-12).reverse();
        for (var j = 0; j < recent.length; j++) {

            else if (pct >= 40) { bgColor = "var(--warning-light)"; fgColor = "var(--warning)"; }

            topicSpan.appendChild(dot);
            var nameSpan = document.createElement("span");
            nameSpan.textContent = topicName;
            topicSpan.appendChild(nameSpan);

            scoreSpan.className = "h-score";
            scoreSpan.style.background = bgColor;
            scoreSpan.style.color = fgColor;

      function PHY_exportReport() {
        var h = PHY_STATE.history;
        if (h.length === 0) {
          PHY_toast(PHY_t("toast_no_data"), "info");
          return;
        }
        var lines = [];
        lines.push(PHY_t("report_title") + " - " + new Date().toLocaleString());
        lines.push("==================================================");
        lines.push("");
        lines.push(PHY_t("report_total_attempts") + ": " + h.length);
        var sum = 0;
        var totalTime = 0;
        for (var i = 0; i < h.length; i++) {
          sum += (h[i].score / h[i].total) * 100;
          totalTime += (h[i].elapsed || 0);
        }
        lines.push(PHY_t("report_avg") + ": " + Math.round(sum / h.length) + "%");
        lines.push(PHY_t("report_best_streak") + ": " + PHY_STATE.bestStreak);
        lines.push(PHY_t("report_total_time") + ": " + Math.round(totalTime / 60) + PHY_t("report_min"));
        lines.push("");
        lines.push(PHY_t("report_recent") + ":");
        lines.push("--------------------------------------------------");
        var recent = h.slice(-30).reverse();
        for (var j = 0; j < recent.length; j++) {
          var r = recent[j];
          var d = new Date(r.ts);
          var topicName = (PHY_LANG === "en") ? r.topic_en : r.topic_zh;
          lines.push(d.toLocaleDateString() + " " + d.toLocaleTimeString() + " | " + topicName + " | " + r.score + "/" + r.total);
        }

        var text = lines.join("\n");
        try {
          var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "phyverse-report-" + Date.now() + ".txt";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          PHY_toast(PHY_t("toast_exported"), "success");
        } catch (e) {
          PHY_toast("Export failed", "info");
        }
      }

        var panels = ["practice", "formulas", "report", "library", "leaderboard"];
        for (var i = 0; i < panels.length; i++) {
          var p = PHY_$("panel-" + panels[i]);
          if (!p) { continue; }
          if (panels[i] === name) {
            p.style.display = "";
            p.classList.add("active");
          } else {
            p.classList.remove("active");
          }
        }
        var btns = document.querySelectorAll(".tab-btn");
        for (var j = 0; j < btns.length; j++) {
          if (btns[j].getAttribute("data-tab") === name) { btns[j].classList.add("active"); }
          else { btns[j].classList.remove("active"); }
        }
        if (name === "report") { PHY_renderReport(); }
        if (name === "library") { PHY_renderLibrary(); }
        if (name === "formulas") { PHY_renderFormulas(); }
      }

      /* ============================================================
         LANGUAGE TOGGLE (含 window.PhyVerse.setLang 同步)
         ============================================================ */
      function PHY_toggleLang() {
        PHY_LANG = (PHY_LANG === "en") ? "zh" : "en";
        PHY_saveLang();
        PHY_applyI18n();
        PHY_buildTopicChips();
        PHY_buildDiffChips();

        if (PHY_STATE.qs.length > 0) {
          var oldCount = PHY_STATE.qs.length;
          var savedNotes = {};
          for (var n in PHY_STATE.notes) {
            if (Object.prototype.hasOwnProperty.call(PHY_STATE.notes, n)) {
              savedNotes[n] = PHY_STATE.notes[n];
            }
          }
          var qCountEl = PHY_$("qCount");
          if (qCountEl) { qCountEl.value = oldCount; }
          PHY_generateQuestions();
          for (var k in savedNotes) {
            if (Object.prototype.hasOwnProperty.call(savedNotes, k)) {
              PHY_STATE.notes[k] = savedNotes[k];
            }
          }
          PHY_saveNotes();
        }

        PHY_renderLibrary();
        PHY_renderFormulas();
        if (PHY_$("panel-report") && PHY_$("panel-report").classList.contains("active")) {
          PHY_renderReport();
        }

        if (window.PhyVerse) {
          window.PhyVerse.setLang(PHY_LANG === "en" ? "en" : "zh-HK");
        }
      }

      /* ============================================================
         INIT
         ============================================================ */
      function PHY_init() {
        PHY_mountDOM();
        PHY_loadState();

        var theme = document.documentElement.getAttribute("data-theme") || "light";
        PHY_applyTheme(theme);

        if (window.PhyVerse) {
          window.PhyVerse.lang = (PHY_LANG === "en") ? "en" : "zh-HK";
          window.PhyVerse.theme = theme;
        }

        PHY_applyI18n();
        PHY_buildTopicChips();
        PHY_buildDiffChips();
        PHY_renderLibrary();
        PHY_renderFormulas();
        PHY_updateStreakBadge();

        var qCount = PHY_$("qCount");
        if (qCount) {
          qCount.addEventListener("input", function () {
            var lbl = PHY_$("countLbl");
            if (lbl) { lbl.textContent = this.value; }
          });
        }

        var genBtn = PHY_$("genBtn");
        if (genBtn) {
          genBtn.addEventListener("click", PHY_generateQuestions);
        }

        var langBtn = PHY_$("langBtn");
        if (langBtn) {
          langBtn.addEventListener("click", PHY_toggleLang);
        }

        var themeBtn = PHY_$("themeBtn");
        if (themeBtn) {
          themeBtn.addEventListener("click", PHY_toggleTheme);
        }

        var exportBtn = PHY_$("exportBtn");
        if (exportBtn) {
          exportBtn.addEventListener("click", PHY_exportReport);
        }

        var clearBtn = PHY_$("clearBtn");
        if (clearBtn) {
          clearBtn.addEventListener("click", function () {
            if (!confirm(PHY_t("confirm_clear"))) { return; }
            PHY_STATE.history = [];
            PHY_STATE.currentStreak = 0;
            PHY_STATE.bestStreak = 0;
            PHY_saveHistory();
            PHY_saveStreak();
            PHY_updateStreakBadge();
            PHY_renderReport();
            PHY_toast(PHY_t("toast_cleared"), "info");
          });
        }

        var tabBtns = document.querySelectorAll(".tab-btn");
        for (var i = 0; i < tabBtns.length; i++) {
          (function (btn) {
            btn.addEventListener("click", function () {
              PHY_switchTab(btn.getAttribute("data-tab"));
            });
          })(tabBtns[i]);
        }

        if (PHY_STATE.qs.length > 0) {
          PHY_renderQuestions();
        }
      }

      window.onerror = function (msg, url, line) {
        var banner = PHY_$("errorBanner");
        if (banner) {
          banner.classList.add("show");
          banner.textContent = "Error (line " + line + "): " + msg;
        }
        return false;
      };

      PHY_init();
      console.log("[PhyVerse Main] v3.0 ready | templates: " + PHY_TEMPLATES.length + " | lang: " + PHY_LANG);
    })();
  </script>

  <script id="phy-ocr">
    (function () {

      /* 1. LAZY LOAD TESSERACT */
      function phyOcrLoadScript() {
        if (PHY_OCR.scriptLoaded) { return Promise.resolve(); }
        if (PHY_OCR.scriptLoading) { return PHY_OCR.scriptLoading; }

        PHY_OCR.scriptLoading = new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = PHY_OCR.cdn;
          s.async = true;
          s.onload = function () {
            PHY_OCR.scriptLoaded = true;
            resolve();
          };
          s.onerror = function () {
            PHY_OCR.scriptLoading = null;
            reject(new Error("Failed to load OCR engine"));
          };
          document.head.appendChild(s);
        });

        return PHY_OCR.scriptLoading;
      }

      /* 2. BUILD MODAL */
      function phyOcrBuildModal() {
        if (PHY_OCR.modal) { return; }

        var backdrop = document.createElement("div");
        backdrop.className = "phy-modal-backdrop";
        backdrop.id = "phyOcrModal";

        var modal = document.createElement("div");
        modal.className = "phy-modal";

        var head = document.createElement("div");
        head.className = "phy-modal-head";
        head.innerHTML = ''
          + '<div class="phy-modal-title">'
          +   '<div class="phy-modal-title-icon">'

          +       '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'

          + '<button class="phy-modal-close" id="phyOcrClose" type="button">'
          +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
          +     '<line x1="18" y1="6" x2="6" y2="18"/>'
          +     '<line x1="6" y1="6" x2="18" y2="18"/>'
          +   '</svg>'

        modal.appendChild(head);

        var preview = document.createElement("img");
        preview.className = "phy-ocr-preview";
        preview.id = "phyOcrPreview";

          + '<div class="phy-progress-bar">'
          +   '<div class="phy-progress-fill" id="phyOcrProgressFill"></div>'
          + '</div>';
        modal.appendChild(progWrap);

        /* 取消檔案選擇後仍可重新選圖（不必關閉再開） */
        var pickBtn = document.createElement("button");
        pickBtn.type = "button";
        pickBtn.id = "phyOcrPickBtn";
        pickBtn.className = "phy-btn-retry";
        pickBtn.textContent = phyOcrT("選擇圖片", "Choose image");
        pickBtn.style.marginTop = "10px";
        pickBtn.addEventListener("click", phyOcrPickFile);
        modal.appendChild(pickBtn);

        var resultWrap = document.createElement("div");
        resultWrap.id = "phyOcrResultWrap";
        resultWrap.style.display = "none";

        var label = document.createElement("div");
        label.className = "phy-ocr-label";
        label.innerHTML = '<span id="phyOcrResultLabel">' + phyOcrT("辨識結果（可修改）", "Recognised text (editable)") + '</span>'
          + '<span class="phy-ocr-confidence" id="phyOcrConfidence">--</span>';
        resultWrap.appendChild(label);

        var textarea = document.createElement("textarea");
        textarea.className = "phy-ocr-textarea";
        textarea.id = "phyOcrTextarea";
        textarea.setAttribute("placeholder", phyOcrT("辨識結果會顯示在這裡...", "Recognised text will appear here..."));
        resultWrap.appendChild(textarea);

        modal.appendChild(resultWrap);

        var actions = document.createElement("div");
        actions.className = "phy-modal-actions";
        actions.id = "phyOcrActions";
        actions.style.display = "none";
        actions.innerHTML = ''
          + '<button class="phy-btn-retry" id="phyOcrRetry" type="button">' + phyOcrT("重試", "Retry") + '</button>'
          + '<button class="phy-btn-apply" id="phyOcrApply" type="button">'
          +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">'
          +     '<polyline points="20 6 9 17 4 12"/>'
          +   '</svg>'
          +   '<span>' + phyOcrT("套用到答案", "Apply to answer") + '</span>'

        modal.appendChild(actions);

        backdrop.appendChild(modal);
        document.body.appendChild(backdrop);
        PHY_OCR.modal = backdrop;

        document.getElementById("phyOcrClose").addEventListener("click", phyOcrCloseModal);
        document.getElementById("phyOcrRetry").addEventListener("click", function () {
          phyOcrReset();
          phyOcrPickFile();
        });
        document.getElementById("phyOcrApply").addEventListener("click", phyOcrApplyResult);

        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) { phyOcrCloseModal(); }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && backdrop.classList.contains("show")) {
            phyOcrCloseModal();
          }

      function phyOcrOpenModal(textareaId) {
        phyOcrBuildModal();
        PHY_OCR.currentTextareaId = textareaId;
        phyOcrReset();
        PHY_OCR.modal.classList.add("show");
        /* 由使用者的點擊直接觸發，避免瀏覽器攔截非手勢的 file picker */
        phyOcrPickFile();
      }

      function phyOcrCloseModal() {
        if (PHY_OCR.modal) { PHY_OCR.modal.classList.remove("show"); }
        PHY_OCR.currentTextareaId = null;
        PHY_OCR.lastResult = null;
      }

      function phyOcrReset() {
        var preview = document.getElementById("phyOcrPreview");
        var resultWrap = document.getElementById("phyOcrResultWrap");
        var actions = document.getElementById("phyOcrActions");
        var progWrap = document.getElementById("phyOcrProgressWrap");
        if (preview) { preview.style.display = "none"; preview.src = ""; }
        if (resultWrap) { resultWrap.style.display = "none"; }
        if (actions) { actions.style.display = "none"; }
        if (progWrap) { progWrap.style.display = "block"; }
        var txt = document.getElementById("phyOcrTextarea");
        if (txt) { txt.value = ""; }
        var apply = document.getElementById("phyOcrApply");
        if (apply) { apply.disabled = false; }
        phyOcrUpdateProgress(phyOcrT("準備中...", "Preparing..."), 0);
        PHY_OCR.lastResult = null;
      }

      /* 3. FILE PICKER */
      function phyOcrPickFile() {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.style.display = "none";
        input.addEventListener("change", function () {
          var f = input.files[0];
          if (f) { phyOcrProcessImage(f); }
          if (input.parentNode) { input.parentNode.removeChild(input); }
        });
        document.body.appendChild(input);
        input.click();
      }

      function phyOcrProcessImage(file) {
        if (!file.type.match(/^image\//)) {
          alert(phyOcrT("請選擇圖片檔案", "Please choose an image file"));
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          alert(phyOcrT("圖片過大（上限 10 MB）", "Image is too large (max 10 MB)"));
          return;
        }

        var reader = new FileReader();
        reader.onload = function (e) {
          var dataUrl = e.target.result;
          var preview = document.getElementById("phyOcrPreview");
          if (preview) {
            preview.src = dataUrl;
            preview.style.display = "block";
          }
          phyOcrRunRecognition(dataUrl);
        };
        reader.onerror = function () {
          alert(phyOcrT("讀取圖片失敗", "Could not read the image"));
        };
        reader.readAsDataURL(file);
      }

      /* 4. RECOGNITION */
      function phyOcrUpdateProgress(text, pct) {
        var txt = document.getElementById("phyOcrProgressText");
        var pctEl = document.getElementById("phyOcrProgressPct");
        var fill = document.getElementById("phyOcrProgressFill");
        if (txt) { txt.textContent = text; }
        if (pctEl) { pctEl.textContent = Math.round(pct) + "%"; }
        if (fill) { fill.style.width = pct + "%"; }
      }

      function phyOcrRunRecognition(dataUrl) {
        phyOcrUpdateProgress(phyOcrT("載入 OCR 引擎...", "Loading OCR engine..."), 5);

        phyOcrLoadScript().then(function () {
          phyOcrUpdateProgress(phyOcrT("初始化辨識器...", "Initialising recogniser..."), 12);
          if (!window.Tesseract) {
            throw new Error("Tesseract not available");
          }

          return window.Tesseract.recognize(dataUrl, "eng+chi_tra", {
            logger: function (m) {
              if (m.status === "loading tesseract core") {
                phyOcrUpdateProgress(phyOcrT("載入核心...", "Loading core..."), 20);
              } else if (m.status === "initializing tesseract") {
                phyOcrUpdateProgress(phyOcrT("初始化中...", "Initialising..."), 30);
              } else if (m.status === "loading language traineddata") {
                phyOcrUpdateProgress(phyOcrT("載入語言包...", "Loading language data..."), 30 + (m.progress || 0) * 30);
              } else if (m.status === "initializing api") {
                phyOcrUpdateProgress(phyOcrT("準備 API...", "Preparing API..."), 65);
              } else if (m.status === "recognizing text") {
                phyOcrUpdateProgress(phyOcrT("辨識中...", "Recognising..."), 65 + (m.progress || 0) * 35);
              }
            }
          });
        }).then(function (result) {
          phyOcrUpdateProgress(phyOcrT("完成", "Done"), 100);
          var text = "";
          var confidence = 0;
          if (result && result.data) {
            text = (result.data.text || "").trim();
            confidence = result.data.confidence || 0;
          }
          PHY_OCR.lastResult = { text: text, confidence: confidence };
          phyOcrShowResult(text, confidence);
        }).catch(function (err) {
          phyOcrUpdateProgress(phyOcrT("失敗：", "Failed: ") + (err.message || "Unknown error"), 100);
          var actions = document.getElementById("phyOcrActions");
          if (actions) { actions.style.display = "flex"; }
          var resultWrap = document.getElementById("phyOcrResultWrap");
          if (resultWrap) { resultWrap.style.display = "block"; }
          var txt = document.getElementById("phyOcrTextarea");
          if (txt) {
            txt.value = phyOcrT("（辨識失敗）\n\n" + (err.message || "") + "\n\n請確認網絡連線，或手動輸入答案。",
                                "(Recognition failed)\n\n" + (err.message || "") + "\n\nCheck your connection, or type the answer manually.");
          }
          var retry = document.getElementById("phyOcrRetry");
          if (retry) { retry.textContent = "重試"; }
          var apply = document.getElementById("phyOcrApply");
          if (apply) { apply.disabled = true; }
        });
      }

      function phyOcrShowResult(text, confidence) {
        var progWrap = document.getElementById("phyOcrProgressWrap");
        if (progWrap) { progWrap.style.display = "none"; }

        var resultWrap = document.getElementById("phyOcrResultWrap");
        if (resultWrap) { resultWrap.style.display = "block"; }

        var actions = document.getElementById("phyOcrActions");
        if (actions) { actions.style.display = "flex"; }

        var apply = document.getElementById("phyOcrApply");
        if (apply) { apply.disabled = false; }

        var txt = document.getElementById("phyOcrTextarea");
        if (txt) { txt.value = text || phyOcrT("（未辨識到文字）", "(No text recognised)"); }

        var conf = document.getElementById("phyOcrConfidence");
        if (conf) {
          var level = "low";
          var isEn = phyOcrIsEn();
          var label = isEn ? "low" : "低";
          if (confidence >= 75) { level = "high"; label = isEn ? "high" : "高"; }
          else if (confidence >= 50) { level = "medium"; label = isEn ? "medium" : "中"; }
          conf.className = "phy-ocr-confidence " + level;
          conf.textContent = (isEn ? "Confidence " + label : "信心 " + label) + " (" + Math.round(confidence) + "%)";
        }
      }

      /* 5. APPLY + ADVICE */
      function phyOcrApplyResult() {
        if (!PHY_OCR.currentTextareaId) { return; }
        var target = document.getElementById(PHY_OCR.currentTextareaId);
        var ocrText = document.getElementById("phyOcrTextarea");
        if (!target || !ocrText) { return; }

        target.value = ocrText.value;
        target.focus();

        var advice = phyOcrGenerateAdvice(ocrText.value);
        phyOcrShowAdvice(advice);

        var card = target.closest(".question");
        if (card) {
          var gradeBtn = card.querySelector(".btn-grade");
          if (gradeBtn) {
            setTimeout(function () {
              gradeBtn.click();
            }, 350);
          }
        }

        var scanBtn = document.querySelector('.phy-scan-btn[data-ans="' + PHY_OCR.currentTextareaId + '"]');
        if (scanBtn) {
          var span = scanBtn.querySelector("span");
          if (span) {
            var isEn = (document.documentElement.lang === "en");
            span.textContent = isEn ? "Scan again" : "重新掃描";
          }
        }

        phyOcrCloseModal();
      }

      /* 6. ADVICE ENGINE */
      function phyOcrGenerateAdvice(text) {
        var en = phyOcrIsEn();
        var advice = [];
        if (!text || text.trim().length === 0) {
          advice.push(en
            ? "No text was recognised. Check the lighting and make the handwriting clearer."
            : "未辨識到任何文字。請確認照片光線充足、字跡清晰。");
          return advice;
        }

        var t = text;
        var numMatches = t.match(/-?\d+\.?\d*/g) || [];
        if (numMatches.length === 0) {
          advice.push(en
            ? "No numerical answer was detected. Calculation questions normally need a final value."
            : "未偵測到數值答案。計算題通常需要一個最終數值。");
        } else if (numMatches.length === 1) {
          advice.push(en
            ? "Only 1 numerical value was found. For multi-step calculations, write down the intermediate steps so you can check them."
            : "找到 1 個數值。若為多步計算，建議寫下中間步驟，方便自己檢查。");
        } else {
          advice.push(en
            ? "Found " + numMatches.length + " numerical values — it looks like you wrote out the calculation steps. Good."
            : "找到 " + numMatches.length + " 個數值，看起來有寫出計算步驟，很好。");
        }

        var unitPatterns = [
          /\b(m\/s|ms-?1|m s-?1|m\/s2|m s-?2)\b/i,
          /\b(kg|g|km)\b/i,
          /\b(N|J|W|V|A|Pa|Hz|MeV|ohm|C|T)\b/i,
          /\b(degC|K)\b/i,
          /\b(年|天|秒|分|個|years?|days?|sec|minutes?)\b/
        ];
        var hasUnit = false;
        for (var i = 0; i < unitPatterns.length; i++) {
          if (unitPatterns[i].test(t)) { hasUnit = true; break; }
        }
        if (numMatches.length > 0 && !hasUnit) {
          advice.push(en
            ? "A value was found, but no unit is visible. Add the correct unit after the answer (e.g. N, J, m s-1)."
            : "找到了數值，但看不到單位。記得在答案後加上正確單位（如 N、J、m s-1）。");
        } else if (hasUnit) {
          advice.push(en ? "Units are shown — good." : "有標示單位，很好。");
        }

        var hasEquals = /[=＝]/.test(t);
        var hasFormulaHint = /\b(sqrt|sin|cos|tan|log|pi)\b/i.test(t)
          || /[a-z]\s*=\s*[a-z0-9]/i.test(t)
          || /[×xX\*\+\/\-]\s*\d/.test(t);
        if (!hasEquals && !hasFormulaHint && numMatches.length > 0) {
          advice.push(en
            ? "Only a value is visible — no formula. HKDSE awards method marks for showing the equation, even if the final answer is right."
            : "只看到數值，看不到公式。即使答案正確，DSE 也需要寫出公式才可獲步驟分。");
        } else if (hasEquals && hasFormulaHint) {
          advice.push(en
            ? "The formula and substitution steps are shown, matching HKDSE marking expectations."
            : "有寫出公式與代入步驟，符合 DSE 評分要求。");
        }

        var wordCount = t.split(/\s+/).filter(function (w) { return w.length > 0; }).length;
        if (wordCount < 3 && numMatches.length <= 1) {
          advice.push(en
            ? "The answer is quite short. If you have time, add one or two more derivation steps."
            : "答案偏短。若有時間，建議多寫一兩步推導。");
        }

        var digitsOnly = /^[\d\s\.\-\+\=\×\*\/\(\)]+$/.test(t);
        if (digitsOnly) {
          advice.push(en
            ? "The answer seems to contain only numbers and symbols — add the physical quantity name or formula."
            : "答案似乎只有數字與符號，缺少物理量名稱或公式。");
        }

        if (PHY_OCR.lastResult && PHY_OCR.lastResult.confidence < 60) {
          advice.push(en
            ? "OCR confidence is low. Please check the recognised text by hand before submitting."
            : "OCR 辨識信心偏低，請人手核對答案框內容是否正確。");
        }

        if (advice.length === 0) {
          advice.push(en
            ? "The answer format looks complete. Compare the value with the reference solution."
            : "作答格式看起來完整，請對照參考答案檢查數值。");
        }

        return advice;
      }

      function phyOcrShowAdvice(adviceList) {
        var old = document.querySelectorAll(".phy-advice-box");
        for (var i = 0; i < old.length; i++) {
          if (old[i].parentNode) {
            old[i].parentNode.removeChild(old[i]);
          }
        }
        if (!adviceList || adviceList.length === 0) { return; }

        var target = document.getElementById(PHY_OCR.currentTextareaId);
        if (!target) { return; }
        var card = target.closest(".question");
        if (!card) { return; }

        var isEn = (document.documentElement.lang === "en");
        var box = document.createElement("div");
        box.className = "phy-advice-box";
        var listItems = "";
        for (var j = 0; j < adviceList.length; j++) {
          listItems += "<li>" + adviceList[j] + "</li>";
        }
        box.innerHTML = ''
          + '<div class="phy-advice-head">'
          +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
          +     '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'
          +   '</svg>'
          +   '<span>' + (isEn ? "AI Suggestion" : "AI 建議") + '</span>'
          + '</div>'
          + '<ul class="phy-advice-list">' + listItems + '</ul>';

        var result = card.querySelector(".result");
        if (result && result.parentNode) {
          result.parentNode.insertBefore(box, result.nextSibling);
        } else {
          var btnRow = card.querySelector(".btn-row");
          if (btnRow && btnRow.parentNode) {
            btnRow.parentNode.insertBefore(box, btnRow.nextSibling);
          } else {
            card.appendChild(box);
          }
        }
      }

      /* 7. INJECT SCAN BUTTONS */
      function phyOcrInjectScanButtons() {
        var cards = document.querySelectorAll(".question");
        var isEn = (document.documentElement.lang === "en");
        for (var i = 0; i < cards.length; i++) {
          var card = cards[i];
          if (card.getAttribute("data-phy-ocr") === "1") { continue; }

          var textarea = card.querySelector('textarea[id^="ans-"]');
          if (!textarea) { continue; }

          var scanRow = document.createElement("div");
          scanRow.className = "phy-scan-row";

          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "phy-scan-btn";
          btn.setAttribute("data-ans", textarea.id);
          btn.innerHTML = ''
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
            +   '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'
            +   '<circle cx="12" cy="13" r="4"/>'
            + '</svg>'
            + '<span>' + (isEn ? "Scan handwritten answer" : "掃描手寫答案") + '</span>';

          btn.addEventListener("click", function () {
            var ansId = this.getAttribute("data-ans");
            phyOcrOpenModal(ansId);
          });

          scanRow.appendChild(btn);

          if (textarea.parentNode) {
            textarea.parentNode.insertBefore(scanRow, textarea);
          }

          card.setAttribute("data-phy-ocr", "1");
        }
      }

      /* 8. LANGUAGE HOOK */
      function phyOcrUpdateLanguage() {
        var lang = document.documentElement.lang;
        var isEn = (lang === "en");

        var btns = document.querySelectorAll(".phy-scan-btn span");
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].textContent.indexOf("掃描") !== -1 || btns[i].textContent.indexOf("Scan") !== -1) {
            btns[i].textContent = isEn ? "Scan handwritten answer" : "掃描手寫答案";
          } else {
            btns[i].textContent = isEn ? "Scan again" : "重新掃描";
          }
        }

        var title = document.getElementById("phyOcrTitle");
        if (title) { title.textContent = isEn ? "Scan Handwritten Answer" : "掃描手寫答案"; }

        var rl = document.getElementById("phyOcrResultLabel");
        if (rl) { rl.textContent = isEn ? "Result (editable)" : "辨識結果（可修改）"; }

        var applySpan = document.querySelector("#phyOcrApply span");
        if (applySpan) { applySpan.textContent = isEn ? "Apply to Answer" : "套用到答案"; }

        var retry = document.getElementById("phyOcrRetry");
        if (retry) { retry.textContent = isEn ? "Retry" : "重試"; }

        var pick = document.getElementById("phyOcrPickBtn");
        if (pick) { pick.textContent = isEn ? "Choose image" : "選擇圖片"; }

        var ocrTa = document.getElementById("phyOcrTextarea");
        if (ocrTa) {
          ocrTa.setAttribute("placeholder", isEn ? "Recognised text will appear here..." : "辨識結果會顯示在這裡...");
        }

        var adviceHeads = document.querySelectorAll(".phy-advice-head span");
        for (var j = 0; j < adviceHeads.length; j++) {
          adviceHeads[j].textContent = isEn ? "AI Suggestion" : "AI 建議";
        }
      }

      /* 9. MUTATION OBSERVER */
      function phyOcrStartObserver() {
        phyOcrInjectScanButtons();

        var observer = new MutationObserver(function (mutations) {
          var needsInject = false;
          for (var i = 0; i < mutations.length; i++) {
            var m = mutations[i];
            if (m.type === "childList" && m.addedNodes.length > 0) {
              for (var j = 0; j < m.addedNodes.length; j++) {
                var node = m.addedNodes[j];
                if (node.nodeType === 1) {
                  if (node.classList && node.classList.contains("question")) {
                    needsInject = true;
                  } else if (node.querySelector && node.querySelector(".question")) {
                    needsInject = true;
                  }
                }
              }
            }
          }
          if (needsInject) {
            if (PHY_OCR.injectTimer) { clearTimeout(PHY_OCR.injectTimer); }
            PHY_OCR.injectTimer = setTimeout(function () {
              phyOcrInjectScanButtons();
            }, 60);
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
      }

      /* 10. HOOK INTO LANGUAGE BUTTON & PHYVERSE BRIDGE */
      function phyOcrHookLangButton() {
        var langBtn = document.getElementById("langBtn");
        if (langBtn) {
          langBtn.addEventListener("click", function () {
            setTimeout(phyOcrUpdateLanguage, 100);
          });
        }
        if (window.PhyVerse && typeof window.PhyVerse.onLangChange === "function") {
          window.PhyVerse.onLangChange(function () {
            setTimeout(phyOcrUpdateLanguage, 50);
          });
        }
      }

      /* 11. INIT */
      function phyOcrInit() {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", phyOcrInit);
          return;
        }
        phyOcrBuildModal();
        phyOcrStartObserver();
        phyOcrHookLangButton();
        setTimeout(phyOcrUpdateLanguage, 200);
        console.log("[PhyVerse OCR] Add-on v2.1 ready");
      }

      phyOcrInit();
    })();
  </script>

      /* 橋接：關閉 3D 實驗並返回選擇器 */
      function PHYLAB_closeExperiment() {

        var resultToolbar = PHYLAB_$("phylabToolbar");
        if (resultToolbar) resultToolbar.classList.remove("result-open");
        var stageMount = PHYLAB_$("phylab-stage-mount");
        if (stageMount) { stageMount.innerHTML = ""; }
        PHYLAB_showScreen("selector");
        PHYLAB_renderSelector();
      }

      /* 是否英文介面（PhyVerse.lang 或 <html lang>） */
      function PHYLAB_isEn() {
        return !!((window.PhyVerse && window.PhyVerse.lang === "en") || document.documentElement.lang === "en");
      }

      /* 顯示評分結果視窗（相容陣列或字串建議、數值或字串結果） */
      function PHYLAB_showResult(result, quiet) {
        if (!result) { return; }
        if (result.error) { PHYLAB_toast(result.error, "warn"); return; }
        var backdrop = PHYLAB_$("phylabResultBackdrop");
        if (!backdrop) { return; }

        var scoreVal = Number(result.score) || 0;
        var isEn = PHYLAB_isEn();
        var emoji, title;
        if (scoreVal >= 90) { emoji = "\uD83C\uDFC6"; title = isEn ? "Perfect!" : "完美！"; }
        else if (scoreVal >= 75) { emoji = "\u2728"; title = isEn ? "Well done" : "表現不錯"; }
        else if (scoreVal >= 55) { emoji = "\uD83D\uDC4D"; title = isEn ? "Good effort" : "尚可接受"; }
        else { emoji = "\uD83D\uDCDA"; title = isEn ? "Keep practising" : "需要改進"; }

        /* 記住最後一次結果，語言切換時可即時重繪（不重播彩紙） */
        window.__lastLabResult = result;
        PHYLAB_$("phylabResultEmoji").textContent = emoji;
        PHYLAB_$("phylabResultTitle").textContent = title;
        PHYLAB_$("phylabResultSub").textContent = (isEn ? "Score: " : "得分：") + scoreVal + " / 100";

        var circumference = 2 * Math.PI * 38;
        var dash = (scoreVal / 100) * circumference;
        var ring = PHYLAB_$("phylabScoreRing");
        if (ring) {
          var color = scoreVal >= 75 ? "#10b981" : (scoreVal >= 55 ? "#f59e0b" : "#ef4444");
          ring.setAttribute("stroke", color);
          ring.setAttribute("stroke-dasharray", quiet
            ? (dash + " " + circumference)
            : ("0 " + circumference));
          if (!quiet) {
            setTimeout(function () { ring.setAttribute("stroke-dasharray", dash + " " + circumference); }, 100);
          }
        }
        var textEl = PHYLAB_$("phylabScoreText");
        if (textEl) {
          var c = scoreVal >= 75 ? "#10b981" : (scoreVal >= 55 ? "#f59e0b" : "#ef4444");
          textEl.style.color = c;
          if (quiet) {
            textEl.textContent = scoreVal + "%";
          } else {
            textEl.textContent = "0%";
            var startTime = Date.now();
            var animate = function () {
              var elapsed = Date.now() - startTime;
              var pct = Math.min(scoreVal, (elapsed / 800) * scoreVal);
              textEl.textContent = Math.round(pct) + "%";
              if (pct < scoreVal) { requestAnimationFrame(animate); }
            };
            animate();
          }
        }

        var measuredStr = (typeof result.measured === "number") ? result.measured.toFixed(2) : String(result.measured !== undefined ? result.measured : "--");
        var expectedStr = (typeof result.expected === "number") ? result.expected.toFixed(2) : String(result.expected !== undefined ? result.expected : "--");
        var errNum = parseFloat(result.errorPct);
        var errStr = !isNaN(errNum) ? errNum.toFixed(2) : String(result.errorPct || "0.0");
        var unitStr = result.unit ? (" " + PHYLAB_esc(result.unit)) : "";
        var errColor = (!isNaN(errNum) && errNum < 5) ? "#10b981" : ((!isNaN(errNum) && errNum < 15) ? "#f59e0b" : "#ef4444");

        var proc = !!result.procedure;
        var lblMine = proc ? (isEn ? 'Your reading' : '你的讀數') : (isEn ? 'Your result' : '你的結果');
        var lblRef = proc ? (isEn ? 'Recorded' : '記錄值') : (isEn ? 'Expected' : '標準值');
        var lblErr = proc ? (isEn ? 'Deviation' : '偏差') : (isEn ? 'Error' : '誤差');
        PHYLAB_$("phylabResultCompare").innerHTML = ''
          + '<div class="phylab-compare-row"><span class="phylab-compare-label">' + lblMine + '</span><span class="phylab-compare-value">' + PHYLAB_esc(measuredStr) + unitStr + '</span></div>'
          + '<div class="phylab-compare-row"><span class="phylab-compare-label">' + lblRef + '</span><span class="phylab-compare-value">' + PHYLAB_esc(expectedStr) + unitStr + '</span></div>'
          + '<div class="phylab-compare-row"><span class="phylab-compare-label">' + lblErr + '</span><span class="phylab-compare-value" style="color:' + errColor + ';">' + PHYLAB_esc(errStr) + '%</span></div>';

        var adviceList = Array.isArray(result.advice) ? result.advice : (result.advice ? [String(result.advice)] : []);
        var adviceHtml = '<div class="phylab-advice-head">' + (isEn ? 'Experiment Advice' : '實驗建議') + '</div><ul>';
        for (var i = 0; i < adviceList.length; i++) {
          adviceHtml += '<li>' + PHYLAB_esc(adviceList[i]) + '</li>';
        }
        adviceHtml += '</ul>';
        PHYLAB_$("phylabResultAdvice").innerHTML = adviceHtml;

        backdrop.classList.add("show");
        var resultToolbar = document.getElementById("phylabToolbar");
        if (resultToolbar) resultToolbar.classList.add("result-open");
        if (!quiet && scoreVal >= 75 && typeof window.PHY_launchConfetti === "function") {
          try { window.PHY_launchConfetti(); } catch (e) {}
        }
      }

      function PHYLAB_hideResult() {
        var backdrop = PHYLAB_$("phylabResultBackdrop");
        if (backdrop) { backdrop.classList.remove("show"); }
        var tb = PHYLAB_$("phylabToolbar");
        if (tb) tb.classList.remove("result-open");
      }

      function PHYLAB_spawnParticles() {
        var wrap = PHYLAB_$("phylabParticles");
        if (!wrap) { return; }
        var html = "";
        for (var i = 0; i < 30; i++) {
          var left = Math.random() * 100;
          var delay = Math.random() * 20;
          var duration = 15 + Math.random() * 15;
          var size = 1 + Math.random() * 3;
          html += '<div class="phylab-particle" style="left:' + left + '%; animation-delay: -' + delay + 's; animation-duration: ' + duration + 's; width:' + size + 'px; height:' + size + 'px;"></div>';
        }
        wrap.innerHTML = html;
      }

      function PHYLAB_bindNavigation() {
        var choices = document.querySelectorAll("[data-phylab-choice]");
        for (var i = 0; i < choices.length; i++) {
          (function (btn) {
            btn.addEventListener("click", function () {
              var choice = btn.getAttribute("data-phylab-choice");
              if (choice === "practice") {
                PHYLAB_hideAll();
              } else if (choice === "experiment") {
                PHYLAB_showScreen("selector");
                PHYLAB_renderSelector();
              }
            });
          })(choices[i]);
        }

        var navs = document.querySelectorAll("[data-phylab-nav]");
        for (var j = 0; j < navs.length; j++) {
          (function (btn) {
            btn.addEventListener("click", function () {
              var target = btn.getAttribute("data-phylab-nav");
              if (target === "launcher") {
                PHYLAB_showScreen("launcher");
              } else if (target === "selector") {
                PHYLAB_closeExperiment();
              }
            });
          })(navs[j]);
        }

        var resetBtn = PHYLAB_$("phylabReset");
        if (resetBtn) {
          resetBtn.addEventListener("click", function () {
            if (!window.__currentExp) { return; }
            if (typeof window.__currentExp.reset === "function") {
              window.__currentExp.reset();
            } else if (window.PhyVerse && typeof window.PhyVerse.openExperiment === "function") {
              window.PhyVerse.openExperiment(window.__currentExp.id);
            }
          });
        }

        var scoreBtn = PHYLAB_$("phylabScore");
        if (scoreBtn) {
          scoreBtn.addEventListener("click", function () {
            if (!window.__currentExp || typeof window.__currentExp.score !== "function") { return; }
            var result = window.__currentExp.score();
            PHYLAB_showResult(result);
          });
        }

        var retryBtn = PHYLAB_$("phylabResultRetry");
        if (retryBtn) {
          retryBtn.addEventListener("click", function () {
            PHYLAB_hideResult();
            if (window.__currentExp && typeof window.__currentExp.reset === "function") {
              window.__currentExp.reset();
            }
          });
        }

        var backBtn = PHYLAB_$("phylabResultBack");
        if (backBtn) {
          backBtn.addEventListener("click", function () {
            PHYLAB_hideResult();
            PHYLAB_closeExperiment();
          });
        }

        var backdrop = PHYLAB_$("phylabResultBackdrop");
        if (backdrop) {
          backdrop.addEventListener("click", function (e) {
            if (e.target === backdrop) { PHYLAB_hideResult(); }
          });
        }
      }

      function PHYLAB_init() {
        PHYLAB_mountShell();
        PHYLAB_spawnParticles();
        PHYLAB_bindNavigation();

        if (window.PhyVerse) {
          window.PhyVerse.openExperiment = PHYLAB_openExperiment;
          window.PhyVerse.closeExperiment = PHYLAB_closeExperiment;
          window.PhyVerse.renderSelector = PHYLAB_renderSelector;
          window.PhyVerse.onLangChange(function (v) {
            var sel = PHYLAB_$("phylabSelector");
            if (sel && !sel.classList.contains("hidden")) {
              PHYLAB_renderSelector();
            }
            if (window.__currentExp) {
              var titleEl = PHYLAB_$("phylabLabTitle");
              if (titleEl) {
                titleEl.textContent = (v === "en")
                  ? (window.__currentExp.title_en || window.__currentExp.title_zh)
                  : (window.__currentExp.title_zh || window.__currentExp.title_en);
              }
              /* 結果視窗開著時，等 3D 模組切換語言後重繪，避免出現中英夾雜的建議 */
              var resultBackdrop = PHYLAB_$("phylabResultBackdrop");
              if (resultBackdrop && resultBackdrop.classList.contains("show") && typeof window.__currentExp.score === "function") {
                setTimeout(function () {
                  try { PHYLAB_showResult(window.__currentExp.score(), true); } catch (e) {}
                }, 140);
              }
            }
          });
        }

        PHYLAB_showScreen("launcher");
        console.log("[PhyVerse Lab v2] Framework ready | registered experiments: " + (window.PhyVerse ? window.PhyVerse.experiments.length : 0));
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", PHYLAB_init);
      } else {
        PHYLAB_init();
      }
    })();
  </script>
