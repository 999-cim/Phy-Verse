  sync3D(dt) {
    const yUnit = this.h / 0.05;
        this._piston.position.y = Math.min(5.8, yUnit);

    /* weight stack visibility */
    const nVis = Math.max(1, Math.round(1 + this.weightDrag * 5));
    this._weightDiscs.forEach((d, i) => d.visible = i < nVis);

    /* particles */
    const pt = this._particles;
    if (pt) {
      const arr = pt.geo.attributes.position.array;
      const spd = Math.sqrt(this.vars.T / 300) * 1.2;
      const R_IN = pt.R - 0.15;
      const topY = yUnit - 0.17;
      for (let i = 0; i < pt.N; i++) {
        arr[i*3]   += pt.vel[i*3]   * spd * dt;
        arr[i*3+1] += pt.vel[i*3+1] * spd * dt;
        arr[i*3+2] += pt.vel[i*3+2] * spd * dt;
        const x = arr[i*3], y = arr[i*3+1], z = arr[i*3+2];
        const rad = Math.hypot(x, z);
        if (rad > R_IN) {
          const nx = x/rad, nz = z/rad;
          const dot = pt.vel[i*3]*nx + pt.vel[i*3+2]*nz;
          pt.vel[i*3]   -= 2*dot*nx;
          pt.vel[i*3+2] -= 2*dot*nz;
          arr[i*3]   = nx * R_IN * 0.97;
          arr[i*3+2] = nz * R_IN * 0.97;
        }
        if (y < 0.12) { pt.vel[i*3+1] = Math.abs(pt.vel[i*3+1]); arr[i*3+1] = 0.12; }
        if (y > topY - 0.08) { pt.vel[i*3+1] = -Math.abs(pt.vel[i*3+1]); arr[i*3+1] = topY - 0.08; }
      }
      pt.geo.attributes.position.needsUpdate = true;
    }

    /* arrows (visible only in vector mode) */
    const show = viewMode === 'vector';
    this._arrowGas.visible = this._arrowExt.visible = this._arrowNet.visible = show;
    if (show) {
      const baseY = yUnit + 0.25;
      const P_gas = this.vars.n * this.R * this.vars.T / (this.A * this.h);
      const F_gas = P_gas * this.A;
      const F_ext = this.pext * 1000 * this.A;
      const F_net = F_gas - F_ext;
      const k = 0.00014;
      const lenGas = Math.max(0.4, Math.min(2.8, Math.abs(F_gas) * k));
      const lenExt = Math.max(0.4, Math.min(2.8, Math.abs(F_ext) * k));
      const lenNet = Math.max(0.4, Math.min(2.8, Math.abs(F_net) * k));
      this._arrowGas.position.set(0.75, baseY, 0);
      this._arrowGas.setDirection(new THREE.Vector3(0, 1, 0));
      this._arrowGas.setLength(lenGas, 0.4, 0.2);
      this._arrowExt.position.set(-0.75, baseY + lenExt, 0);
      this._arrowExt.setDirection(new THREE.Vector3(0, -1, 0));
      this._arrowExt.setLength(lenExt, 0.4, 0.2);
      this._arrowNet.position.set(0, baseY, 0.9);
      this._arrowNet.setDirection(new THREE.Vector3(0, F_net >= 0 ? 1 : -1, 0));
      this._arrowNet.setLength(lenNet, 0.35, 0.18);
    }
  },

    const Pext = this.vars.pext * 1000;
    const targetH = this.vars.n * this.R * this.vars.T / Pext / this.A;
    this.h += (targetH - this.h) * Math.min(1, dt * 2.5);
    this.h = Math.max(0.04, Math.min(0.40, this.h));
    this.updateV();
  },

  sync3D(dt) {
    const yUnit = this.h / 0.05;
    this._piston.position.y = Math.min(5.8, yUnit);

    /* coil glow */

    const heatFrac = Math.max(0, Math.min(1, (this.vars.T - 300) / 200));
    if (this._coilGlow) {
      this._coilGlow.material.opacity = this.voltage > 0 ? 0.15 + heatFrac * 0.55 : heatFrac * 0.3;
    }
    if (this._pointsMat) {
      this._pointsMat.color.setHSL(0.58 - heatFrac * 0.45, 0.85, 0.6);
    }

    /* particles */
    const pt = this._particles;
    if (pt) {
      const arr = pt.geo.attributes.position.array;
      const spd = Math.sqrt(this.vars.T / 300) * 1.2;
      const R_IN = pt.R - 0.15;
      const topY = yUnit - 0.17;
      for (let i = 0; i < pt.N; i++) {
        arr[i*3]   += pt.vel[i*3]   * spd * dt;
        arr[i*3+1] += pt.vel[i*3+1] * spd * dt;
        arr[i*3+2] += pt.vel[i*3+2] * spd * dt;
        const x = arr[i*3], y = arr[i*3+1], z = arr[i*3+2];
        const rad = Math.hypot(x, z);
        if (rad > R_IN) {
          const nx = x/rad, nz = z/rad;
          const dot = pt.vel[i*3]*nx + pt.vel[i*3+2]*nz;
          pt.vel[i*3] -= 2*dot*nx;
          pt.vel[i*3+2] -= 2*dot*nz;
          arr[i*3] = nx * R_IN * 0.97;
          arr[i*3+2] = nz * R_IN * 0.97;
        }
        if (y < 0.12) { pt.vel[i*3+1] = Math.abs(pt.vel[i*3+1]); arr[i*3+1] = 0.12; }
        if (y > topY - 0.08) { pt.vel[i*3+1] = -Math.abs(pt.vel[i*3+1]); arr[i*3+1] = topY - 0.08; }
      }
      pt.geo.attributes.position.needsUpdate = true;
    }

    /* arrows */
    const show = viewMode === 'vector';
    this._arrowGas.visible = this._arrowExt.visible = show;
    if (show) {
      const baseY = yUnit + 0.25;
      const P_int = this.vars.pext * 1000;   /* equal at equilibrium */

      const F_ext = P_int * this.A;
      const k = 0.00014;

      this._arrowGas.position.set(0.75, baseY, 0);
      this._arrowGas.setDirection(new THREE.Vector3(0, 1, 0));
      this._arrowGas.setLength(len, 0.4, 0.2);
      this._arrowExt.position.set(-0.75, baseY + len, 0);
      this._arrowExt.setDirection(new THREE.Vector3(0, -1, 0));
      this._arrowExt.setLength(len, 0.4, 0.2);
    }
  },

  _drawDisplay() {

  reset() {
  this.t = 0;

    c.visible = true;
    c.scale.set(1, 1, 1);
  }
},

  update(dt) {
  if (this.voltage <= 0 || !this.equip.psu || !this.equip.heater) { this.t += dt; return; }
  const P = this.voltage * this.voltage / this.R_HEAT;
  /* ×20 speed-up so a classroom demo melts the ice in seconds, not minutes */
  const dQ = P * dt * 20;
    if (this.phase === 'solid') {
      this.vars.T += dQ / (this.vars.ice * this.C_ICE);
      if (this.vars.T >= 273) { this.vars.T = 273; this.phase = 'melting'; }
    } else if (this.phase === 'melting') {
      this.melted += dQ / this.L_FUS;
      if (this.melted >= this.vars.ice) { this.melted = this.vars.ice; this.phase = 'liquid'; }
    } else {
      this.vars.T += dQ / (this.vars.ice * this.C_WATER);
      this.vars.T = Math.min(373, this.vars.T);
    }
    this.t += dt;
  },

 sync3D(dt) {
  /* how many cubes should exist for the current ice mass? */
  const totalCubes = Math.max(1, Math.min(this._iceCubes.length,
                       Math.round(this.vars.ice / 0.025)));
  const frac = this.melted / this.vars.ice;
  const N = totalCubes;
  this._iceCubes.forEach((c, i) => {
    if (i >= totalCubes) { c.visible = false; return; }
    const startAt = (i / N) * 0.4;
    const localFrac = Math.max(0, Math.min(1, (frac - startAt) / 0.6));
    const s = 1 - localFrac;
    c.scale.set(s, s, s);
    c.visible = s > 0.06;
    if (c.visible) {
      c.rotation.y += dt * 0.2;
      c.rotation.x += dt * 0.08;
    }
  });
  /* water level rises from 0.2 up to 1.4 as all ice melts */
  if (this._water) {
    const level = 0.2 + frac * 1.2;
    this._water.scale.y = level / 0.1;
    this._water.position.y = level / 2 + 0.1;
  }
    /* glow */
    if (this._glow) {
      this._glow.material.opacity = this.voltage > 0 ? 0.4 : 0;

    if (this._thermo) {

          tc:'將<b>電壓</b>設 &gt; 0 加熱冰。0 °C 平台持續到冰全部融化 — 能量用於 L_f，而非升溫。',
          sc:'将<b>电压</b>设 &gt; 0 加热冰。0 °C 平台持续到冰全部融化 — 能量用于 L_f，而非升温。' }) +
      '</div></div>';

  },

    el.querySelector('#sl-volt').addEventListener('input', e => {

      this._drawDisplay();

    g.add(this._arrowT, this._arrowW);
    this.angle = 0.35;
    this.omega = 0;
  },
  update(dt) {
    const gv = this.vars.g;
    /* simple pendulum: alpha = -(g/L) sin(theta) */
    const alpha = -(gv/this.vars.L) * Math.sin(this.angle) - 0.2 * this.omega;
    this.omega += alpha * dt;
    this.angle += this.omega * dt;
    this.t += dt;

  sync3D(dt) {

  ],
  variables:[
    {id:'dye', name:{en:'Dye brightness', tc:'染料亮度', sc:'染料亮度'}, min:0.2, max:1, step:0.05, def:0.7, unit:''}
  ],
  graph:{
    activeType:0,
    types:[
      { id:'conv', label:{en:'Current speed vs V', tc:'流速 對 V', sc:'流速 对 V'},
        xLabel:'V (V)', yLabel:'Speed (arb.)', xMax:24, xFmt:0, yFmt:2, slopeUnit:'',
        current(){ return { x:this.voltage, y: this.voltage*this.voltage/400 }; } }
    ],
    yMax(){ return 4; }
  },
  playing:true, t:0,
  vars:{ dye:0.7 },
  equip:{ tank:true, water:true, htr:true, ice:true, psu:true, th:true },
  voltage:12,
  _particles:null, _heater:null,

    init() {
    const g = root3d;
    addGround();

    /* 玻璃水缸 + 鋁合金框 + 半透明水體 */
    const tankGroup = new THREE.Group();
    const tank = rbox(3, 3, 1.4, 0.04, MAT.glassThin(), 3);
    tank.position.y = 1.5;
    tankGroup.add(tank);
    const water = rbox(2.9, 2.7, 1.3, 0.04, MAT.water(), 3);
    water.position.y = 1.40;
    tankGroup.add(water);
    for (const sx of [-1.5, 1.5]) for (const sz of [-0.7, 0.7]) {
      tankGroup.add(makeAluFrameBar(new THREE.Vector3(sx, 0.04, sz), new THREE.Vector3(sx, 2.96, sz), 0.035));
    }
    for (const y of [0.04, 2.96]) for (const sz of [-0.7, 0.7]) {
      tankGroup.add(makeAluFrameBar(new THREE.Vector3(-1.5, y, sz), new THREE.Vector3(1.5, y, sz), 0.028));
    }
    g.add(tankGroup);
    this._tank = tank;
    this._tankWater = water;
    this._thermo = createLabThermometer(1.18, 0.18, 0.0, 0xff3b30, 1.9);
    g.add(this._thermo.group);

    /* 數位電源 */
    const psu = createPSU({ w: 1.3, h: 1.0, d: 0.9, screenW: 1.0, screenH: 0.55 });
    psu.group.position.set(-3.2, 0, 0.9);
    g.add(psu.group);
    this._psuCtx = psu.ctx; this._psuTex = psu.tex; this._psuScreen = psu.screen;
    g.add(createWire([[-2.8, 0.45, 0.6], [-1.9, 0.4, 0.3], [-1.0, 0.2, 0]], 0xcc3333, 0.035));
    g.add(createWire([[-3.4, 0.45, 0.6], [-2.1, 0.4, -0.3], [-1.0, 0.2, 0]], 0x22282f, 0.035));

    /* Heater at bottom left */
    const htr = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.15, 0.7),
      new THREE.MeshStandardMaterial({ color: 0xff5f56, metalness: 0.5, roughness: 0.4 })
    );
    htr.position.set(-1, 0.1, 0);
    htr.castShadow = true;
    g.add(htr);
    this._heater = htr;

    /* Ice at top right */
    const ice = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.55, 0.55),
      new THREE.MeshStandardMaterial({ color: 0xdfeaf7, transparent: true, opacity: 0.7 })
    );
    ice.position.set(1.2, 2.85, 0);
    ice.castShadow = true;
    g.add(ice);

    /* Particles flowing along a closed convection loop */
    const N = 120;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const u = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      u[i] = i / N;
      const p = this._loopPoint(u[i]);
      pos[i*3]   = p.x;
      pos[i*3+1] = p.y;
      pos[i*3+2] = p.z;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.12, color: 0xff6a2a, transparent: true, opacity: 0.9,
      blending: THREE.NormalBlending, sizeAttenuation: true, depthWrite: false
    });
    this._particles = { geo, u, N, mat };
    g.add(new THREE.Points(geo, mat));
  },

  /* Rectangle loop: up left, across top, down right, across bottom */
  _loopPoint(t) {
    t = ((t % 1) + 1) % 1;
    const w = 1.15, yLow = 0.35, yHigh = 2.7, cx = 0;
    let x, y;
    if (t < 0.4) {
      x = -w;                                  y = yLow + (yHigh - yLow) * (t / 0.4);
    } else if (t < 0.5) {
      x = -w + (2 * w) * ((t - 0.4) / 0.1);    y = yHigh;
    } else if (t < 0.9) {
      x = w;                                   y = yHigh - (yHigh - yLow) * ((t - 0.5) / 0.4);
    } else {
      x = w - (2 * w) * ((t - 0.9) / 0.1);     y = yLow;
    }
    return { x, y, z: 0 };
  },

  _drawDisplay() {
    const c = this._psuCtx;
    if (!c) return;
    c.fillStyle = '#06120c'; c.fillRect(0,0,256,128);
    c.strokeStyle = '#1c3a2a'; c.lineWidth = 4; c.strokeRect(2,2,252,124);
    c.fillStyle = '#3f8a63'; c.font = 'bold 12px ui-monospace,monospace';
    c.fillText('SUPPLY', 12, 22);
    c.fillStyle = this.voltage > 0 ? '#4dffa0' : '#2a6a4a';
    c.font = 'bold 42px ui-monospace,monospace';
    c.fillText(this.voltage.toFixed(1), 12, 78);
    c.font = 'bold 20px ui-monospace,monospace';
    c.fillText('V', 165, 78);
    if (this._psuTex) this._psuTex.needsUpdate = true;
  },
  update(dt){ this.t += dt; },
    sync3D(dt) {
    const P = this._particles;
    if (!P) return;
    const arr = P.geo.attributes.position.array;
    /* speed scales with power ~ V²; base crawl so it never fully stops */
    const speed = 0.03 + (this.voltage * this.voltage / 400) * 0.35;
    P.mat.opacity = 0.3 + this.vars.dye * 0.6;
    for (let i = 0; i < P.N; i++) {
      P.u[i] = (P.u[i] + speed * dt) % 1;
      const pt = this._loopPoint(P.u[i]);
      arr[i*3]   = pt.x;
      arr[i*3+1] = pt.y;
      arr[i*3+2] = pt.z;
    }
    P.geo.attributes.position.needsUpdate = true;
    if (this._heater) {
      this._heater.material.color.setHex(this.voltage > 0 ? 0xff5f56 : 0x555b68);
      if (this._heater.material.emissive) {
        this._heater.material.emissive.setHex(this.voltage > 0 ? 0x661100 : 0x000000);
      }
    }
    if (this._tankWater) {
      this._tankWater.material.opacity = 0.22 + this.vars.dye * 0.14;
    }
    if (this._thermo) {
      this._thermo.group.visible = this.equip.th !== false;
      updateLabThermometer(this._thermo, 293 + this.voltage * 1.2, 273, 373);
    }
    if (this._psuTex) this._drawDisplay();
  },
  sidebar() {
    let h = '';
    h += '<div class="card"><div class="card-head"><h3>' + t('equipment') + '</h3><span class="badge">6</span></div>';
    for (const e of this.equipment) h += chkHTML(e.id, T(e.name), this.equip[e.id] !== false);
    h += '</div>';
    h += '<div class="card"><div class="card-head"><h3>' + t('variables') + '</h3></div>';
    for (const v of this.variables) h += sliderHTML(v.id, T(v.name), v.min, v.max, v.step, this.vars[v.id], v.unit, v.locked);
    h += '</div>';
    h += '<div class="card"><div class="card-head"><h3>' + t('power') + '</h3></div>';
    h += '<div class="psu-display"><span class="lbl">V</span><span class="val" id="psu-v">' + this.voltage.toFixed(1) + '</span></div>';
    h += sliderHTML('volt', t('voltage'), 0, 24, 0.1, this.voltage, ' V');
    h += '</div>';
    h += '<div class="card"><div class="card-head"><h3>' + t('hint') + '</h3></div><div class="hint-text">' +
      T({ en:'Raise the <b>voltage</b> to speed up the convection loop. Warm water rises on the left, cools and sinks on the right.',
          tc:'提高<b>電壓</b>加快對流循環。左側暖水上升，右側冷卻下沉。',
          sc:'提高<b>电压</b>加快对流循环。左侧暖水上升，右侧冷却下沉。' }) +
      '</div></div>';
    return h;
  },
  bindSidebar(el) {
    bindSliders(el, this.variables, this.vars, () => {});

    el.querySelector('#sl-volt').addEventListener('input', e => {

  },

    return [
      ['V', this.voltage.toFixed(1) + ' V'],
      ['Power', (this.voltage*this.voltage/20).toFixed(1) + ' W'],
      ['Flow', this.voltage > 0 ? 'Rising left, sinking right' : 'Static', true]
    ];
  }
});
